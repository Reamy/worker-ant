name: OSS Release Gate

# 发布闸：**全历史**密钥/隐私扫描。慢，故**不压在每次 push** 上——只在打 tag（v*）或手动触发时跑。
# 逻辑唯一真源 = scripts/oss-secret-scan.sh（本 workflow 只调用它，不复制任何扫描逻辑）。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全历史扫描必须完整历史（浅克隆会漏掉历史提交里的密钥）

      - name: 安装 gitleaks（脚本依赖它；缺失会被脚本判为 BLOCKER）
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: 全历史密钥/隐私扫描（唯一真源 scripts/oss-secret-scan.sh）
        run: bash scripts/oss-secret-scan.sh

      - name: 归档扫描结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-scan
          path: data/oss-scan-*.txt
          if-no-files-found: error
