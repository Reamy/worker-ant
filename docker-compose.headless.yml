# zx_20261108_1 B8：第二台机器（真 Linux 容器）上的无头工蚁节点。
#
# 宿主先起 ANS（`pnpm dev:ans`），然后：
#   ANS_API_KEY=... ANS_SECRET_KEY=... docker compose -f docker-compose.headless.yml up -d --build
#   docker compose -f docker-compose.headless.yml logs -f
# 或直接用脚本（会从宿主 DB 读凭据、等注册出证据）：
#   bash scripts/headless-docker.sh
#
# 容器内 `/data` 是节点自己的库（独立节点身份），绝不挂宿主 node_modules——
# better-sqlite3 在镜像构建时按 linux/arm64 重编（见 Dockerfile.headless 注释）。
services:
  headless:
    build:
      context: .
      dockerfile: Dockerfile.headless
    image: wa-headless:dev
    container_name: wa-headless
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      # 容器内的 localhost 不是宿主；必须走 host.docker.internal。
      ANS_SERVER_URL: ${ANS_SERVER_URL:-http://host.docker.internal:27183}
      ANS_API_KEY: ${ANS_API_KEY:?需要宿主 ANS 的用户级 key（或跑 scripts/headless-docker.sh 自动读库）}
      ANS_SECRET_KEY: ${ANS_SECRET_KEY:?需要宿主 ANS 的用户级 secret}
      WA_NODE_NAME: ${WA_NODE_NAME:-wa-docker-linux}
      WA_DATA_DIR: /data
    volumes:
      - wa-headless-data:/data
    # 默认驻留 1 小时；`--work` 才会真正消费中继任务（否则只领活不执行）。
    command: ['--duration', '${WA_DURATION:-3600}', '--heartbeat-sec', '${WA_HEARTBEAT_SEC:-5}', '--work']
    restart: 'no'

volumes:
  wa-headless-data:
