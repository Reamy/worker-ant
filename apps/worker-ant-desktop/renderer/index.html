<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工蚁系统</title>
    <!-- zx_20261122_1 M5「夜·度」：首屏前定主题，避免暗色闪白。读 localStorage 缓存；
         未设或 system 时跟 prefers-color-scheme。任何异常都不影响启动（回落浅色）。 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('wa.theme');
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.classList.toggle('wa-dark', dark);
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
